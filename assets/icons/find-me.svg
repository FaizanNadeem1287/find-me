<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Lens Flare Gradient -->
    <radialGradient id="lensGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Subtle Accent Ring Inside Tile -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#45475a" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Magnifying Glass Group -->
  <g filter="url(#glow)">
    <!-- Glass Handle -->
    <path d="M 305 305 L 420 420" stroke="url(#handleGrad)" stroke-width="46" stroke-linecap="round"/>
    <path d="M 305 305 L 420 420" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-opacity="0.25"/>

    <!-- Lens Circle (Glass fill) -->
    <circle cx="216" cy="216" r="132" fill="url(#lensGrad)"/>

    <!-- Glass Rim (Metallic outer ring) -->
    <circle cx="216" cy="216" r="132" fill="none" stroke="url(#rimGrad)" stroke-width="28"/>

    <!-- Lens Specular Glare -->
    <path d="M 125 150 A 110 110 0 0 1 200 106" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Speed Lightning Accent (Finding files in sub-5ms) -->
    <polygon points="230,120 160,230 215,230 185,320 275,200 220,200" fill="url(#boltGrad)" filter="url(#dropShadow)"/>
  </g>
</svg>
